<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>501 練習</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #12151c;
    --panel: #1a1f29;
    --line: #2b3240;
    --text: #e8ecf3;
    --muted: #7d8798;
    --dim: #333b48;
    --accent: #4ade80;
    --danger: #f87171;
    --warn: #fbbf24;
  }

  html { height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: clamp(8px, 1.2vw, 16px);
    padding: clamp(10px, 1.6vw, 20px);
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  main {
    flex: 1 1 0;
    max-width: 1000px;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.4vh, 16px);
  }

  .label {
    font-size: clamp(11px, 1.4vw, 14px);
    letter-spacing: .14em;
    color: var(--muted);
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
  }

  /* ---- 残り点 ---- */
  .remaining {
    padding: clamp(6px, 1.2vh, 14px) 20px clamp(2px, 1vh, 10px);
    text-align: center;
  }

  .remaining-value {
    font-size: clamp(88px, 20vw, 220px);
    line-height: .95;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.03em;
  }

  .remaining.is-win .remaining-value { color: var(--accent); }
  .remaining.is-over .remaining-value { color: var(--muted); }

  /* ---- スタッツ（今のゲーム + 通算を横並び） ---- */
  .stats {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: clamp(6px, 1vw, 12px);
  }

  .stat { padding: clamp(8px, 1.4vh, 14px) clamp(10px, 1.4vw, 18px); }

  .stat .label { font-size: clamp(10px, 1.1vw, 13px); letter-spacing: .08em; }

  .stat-value {
    font-size: clamp(24px, 3.4vw, 44px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }

  .stat-value small {
    font-size: .5em;
    font-weight: 500;
    color: var(--muted);
  }

  /* 通算側はひとまわり控えめにして、今のゲームと区別する */
  .stat.is-total { background: #161b24; }
  .stat.is-total .stat-value { font-size: clamp(20px, 2.6vw, 34px); }

  /* ---- 入力 ---- */
  input {
    display: block;
    width: 100%;
    background: #0d1016;
    border: 2px solid var(--line);
    border-radius: 16px;
    color: var(--text);
    font-family: inherit;
    font-size: clamp(40px, 8vw, 76px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: center;
    padding: clamp(2px, 1vh, 10px) 16px;
  }

  input:focus { outline: none; border-color: var(--accent); }
  input:disabled { color: var(--dim); border-style: dashed; }

  /* 上がりの投数を待っている状態 */
  input.is-darts { border-color: var(--accent); background: #0e1712; }

  .message {
    min-height: 1.6em;
    margin-top: clamp(4px, .8vh, 10px);
    font-size: clamp(13px, 1.8vw, 20px);
    text-align: center;
    color: var(--muted);
  }

  .message.is-bust { color: var(--danger); font-weight: 700; }
  .message.is-error { color: var(--warn); }
  .message.is-win { color: var(--accent); font-weight: 700; }

  /* ---- 履歴（ラウンド / ゲームを横並び） ---- */
  .histories {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(8px, 1.4vw, 16px);
  }

  .histories > .panel {
    min-height: 0;
    padding: clamp(8px, 1.2vh, 14px) clamp(6px, .8vw, 10px);
    display: flex;
    flex-direction: column;
  }

  .histories .label { padding: 0 clamp(8px, 1vw, 12px) clamp(4px, .8vh, 8px); }

  .list {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-rows: repeat(10, minmax(0, 1fr));
    gap: 2px;
  }

  .row, .game {
    align-items: center;
    padding: 0 clamp(6px, .8vw, 10px);
    border-radius: 6px;
    font-size: clamp(13px, 1.5vw, 19px);
    font-variant-numeric: tabular-nums;
  }

  /* ラウンド履歴 */
  .row { display: grid; grid-template-columns: 2.4em 1fr 1fr; }
  .row .no { color: var(--muted); font-size: .66em; }
  .row .score { text-align: right; font-weight: 700; }
  .row .rest { text-align: right; color: var(--muted); }
  .row .score small { font-size: .58em; margin-left: .35em; }

  .row.is-empty,
  .row.is-empty .no,
  .row.is-empty .rest { color: var(--dim); }

  .row.is-bust { background: rgba(248, 113, 113, .1); }
  .row.is-bust .score { color: var(--danger); }

  /* ゲーム履歴 */
  .game { display: grid; grid-template-columns: 2.4em 1fr auto; gap: 6px; }
  .game .gno { color: var(--muted); font-size: .66em; }
  .game .gavg { text-align: right; font-weight: 700; }
  .game .gres { font-size: .66em; color: var(--muted); min-width: 3.4em; text-align: right; }

  .game.is-win .gavg { color: var(--accent); }

  .game.is-empty,
  .game.is-empty .gno,
  .game.is-empty .gres { color: var(--dim); }

  /* ---- 操作 ---- */
  .actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(8px, 1.4vw, 16px);
  }

  button {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--text);
    font-family: inherit;
    font-size: clamp(12px, 1.6vw, 18px);
    padding: clamp(10px, 1.8vh, 18px);
    cursor: pointer;
  }

  button:active { background: #232a36; }

  /* ---- 狭い画面 ---- */
  @media (max-width: 860px) {
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .histories { flex: none; }
    .list { grid-template-rows: repeat(10, minmax(1.9em, auto)); }
  }

  /* 極狭幅はスタッツ2列・履歴を縦積みに戻す */
  @media (max-width: 470px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .histories { grid-template-columns: 1fr; }
  }

  /* 横長で背が低い画面はメイン側の文字を抑える */
  @media (min-width: 700px) and (max-height: 780px) {
    .remaining-value { font-size: clamp(80px, 13vh, 140px); }
    .stat-value { font-size: clamp(30px, 6vh, 48px); }
    input { font-size: clamp(34px, 7vh, 56px); }
  }
</style>
</head>
<body>
<main>
  <section class="panel remaining" id="remainingBox">
    <div class="label">残り</div>
    <div class="remaining-value" id="remaining">501</div>
  </section>

  <section class="stats">
    <div class="panel stat">
      <div class="label">1R平均</div>
      <div class="stat-value" id="average">--</div>
    </div>
    <div class="panel stat">
      <div class="label">ラウンド</div>
      <div class="stat-value"><span id="roundCount">0</span><small> / 10</small></div>
    </div>
    <div class="panel stat is-total">
      <div class="label">通算1R平均</div>
      <div class="stat-value" id="totalAverage">--</div>
    </div>
    <div class="panel stat is-total">
      <div class="label">上がり</div>
      <div class="stat-value"><span id="winCount">0</span><small> / <span id="gameCount">0</span></small></div>
    </div>
    <div class="panel stat is-total">
      <div class="label">ベスト1R平均</div>
      <div class="stat-value" id="bestAverage">--</div>
    </div>
  </section>

  <section>
    <input id="input" type="text" inputmode="numeric" autocomplete="off"
           aria-label="ラウンドの合計点" autofocus>
    <div class="message" id="message"></div>
  </section>

  <section class="histories">
    <div class="panel">
      <div class="label">ラウンド履歴</div>
      <div class="list" id="history"></div>
    </div>
    <div class="panel">
      <div class="label">ゲーム履歴（直近10）</div>
      <div class="list" id="gameList"></div>
    </div>
  </section>

  <section class="actions">
    <button type="button" id="undo">1つ戻す</button>
    <button type="button" id="reset">リセット</button>
    <button type="button" id="clearGames">履歴クリア</button>
  </section>
</main>

<script>
  const START = 501;
  const MAX_ROUNDS = 10;
  const MAX_GAMES = 10;
  const DARTS_PER_ROUND = 3;

  // 3ダーツでダブルフィニッシュできない残り点
  const IMPOSSIBLE_CHECKOUT = new Set([169, 168, 166, 165, 163, 162, 159]);
  const canCheckout = (n) => n >= 2 && n <= 170 && !IMPOSSIBLE_CHECKOUT.has(n);

  // 3ダーツの合計として出せない点数
  const IMPOSSIBLE_SCORE = new Set([179, 178, 176, 175, 173, 172, 169, 166, 163]);

  const state = {
    remaining: START,
    rounds: [],   // { input, scored, remaining, bust, darts } — darts は上がりラウンドのみ 1〜3
    games: [],    // { no, rounds, darts, scored, remaining, avg, win } — 表示・集計は直近 MAX_GAMES 件
    result: null, // null | 'win' | 'over'
    awaitingDarts: false, // 上がりラウンドの投数入力を待っている状態
    recorded: false, // 現在のゲームを games に記録済みか
    message: '',
    messageType: '',
  };

  const el = {
    remainingBox: document.getElementById('remainingBox'),
    remaining: document.getElementById('remaining'),
    average: document.getElementById('average'),
    roundCount: document.getElementById('roundCount'),
    input: document.getElementById('input'),
    message: document.getElementById('message'),
    history: document.getElementById('history'),
    undo: document.getElementById('undo'),
    reset: document.getElementById('reset'),
    totalAverage: document.getElementById('totalAverage'),
    winCount: document.getElementById('winCount'),
    gameCount: document.getElementById('gameCount'),
    bestAverage: document.getElementById('bestAverage'),
    gameList: document.getElementById('gameList'),
    clearGames: document.getElementById('clearGames'),
  };

  // 投数の合計。上がりラウンド以外は3本、投数未入力のうちは暫定で3本として数える
  const totalDarts = () =>
    state.rounds.reduce((sum, r) => sum + (r.darts ?? DARTS_PER_ROUND), 0);

  // 3ダーツアベレージ（削り点 ÷ 投数 × 3）。全ラウンド3本なら1ラウンド平均と一致する
  const average = () => {
    const darts = totalDarts();
    return darts === 0 ? null : (START - state.remaining) / darts * DARTS_PER_ROUND;
  };

  // 保存対象は直近 MAX_GAMES ゲームぶん
  const recentGames = () => state.games.slice(-MAX_GAMES);

  function setMessage(text, type) {
    state.message = text;
    state.messageType = type || '';
  }

  function recordGame() {
    const prev = state.games[state.games.length - 1];
    state.games.push({
      no: prev ? prev.no + 1 : 1,
      rounds: state.rounds.length,
      darts: totalDarts(),
      scored: START - state.remaining,
      remaining: state.remaining,
      avg: average(),
      win: state.result === 'win',
    });
    state.recorded = true;
  }

  function submitRound(score) {
    if (state.result !== null || state.awaitingDarts) return;

    if (!Number.isInteger(score) || score < 0 || score > 180) {
      setMessage('0〜180 の範囲で入力してください', 'error');
      render();
      return;
    }
    if (IMPOSSIBLE_SCORE.has(score)) {
      setMessage(`${score} は3本の合計では出せない点数です`, 'error');
      render();
      return;
    }

    const before = state.remaining;
    const next = before - score;
    const bust = next < 0 || next === 1 || (next === 0 && !canCheckout(before));

    if (bust) {
      state.rounds.push({ input: score, scored: 0, remaining: before, bust: true, darts: DARTS_PER_ROUND });
      setMessage('BUST — 残り点はそのままです', 'bust');
    } else {
      state.remaining = next;
      state.rounds.push({ input: score, scored: score, remaining: next, bust: false, darts: null });
      if (next === 0) {
        // 上がったラウンドは何投で終えたか分からないので、投数の入力を待つ
        state.awaitingDarts = true;
        setMessage('何投目で上がりましたか？（1〜3 を入力してください）', 'win');
      } else {
        state.rounds[state.rounds.length - 1].darts = DARTS_PER_ROUND;
        setMessage('', '');
      }
    }

    if (state.result === null && !state.awaitingDarts && state.rounds.length >= MAX_ROUNDS) {
      state.result = 'over';
      setMessage(`10R 終了です。残り ${state.remaining} / 1R平均 ${average().toFixed(1)} — Enter で次のゲームへ進みます`, 'error');
    }

    if (state.result !== null) recordGame();

    render();
  }

  // 上がりラウンドの投数（1〜3）を確定してゲームを終える
  function submitDarts(darts) {
    if (!state.awaitingDarts) return;

    if (!Number.isInteger(darts) || darts < 1 || darts > DARTS_PER_ROUND) {
      setMessage('1〜3 のいずれかを入力してください', 'error');
      render();
      return;
    }

    state.rounds[state.rounds.length - 1].darts = darts;
    state.awaitingDarts = false;
    state.result = 'win';
    setMessage(`上がりです！ ${totalDarts()}投 / 1R平均 ${average().toFixed(1)} — Enter で次のゲームへ進みます`, 'win');
    recordGame();
    render();
  }

  function undo() {
    if (state.rounds.length === 0) return;
    if (state.recorded) {
      state.games.pop();
      state.recorded = false;
    }
    state.rounds.pop();
    const last = state.rounds[state.rounds.length - 1];
    state.remaining = last ? last.remaining : START;
    state.result = null;
    state.awaitingDarts = false;
    setMessage('1つ戻しました', '');
    render();
  }

  function reset() {
    state.remaining = START;
    state.rounds = [];
    state.result = null;
    state.awaitingDarts = false;
    state.recorded = false;
    setMessage('', '');
    el.input.value = '';
    render();
  }

  function clearGames() {
    if (state.games.length === 0) return;
    if (!confirm('ゲーム履歴をすべて削除します。よろしいですか？')) return;
    state.games = [];
    state.recorded = false;
    render();
  }

  function renderRounds() {
    let rows = '';
    for (let i = 0; i < MAX_ROUNDS; i++) {
      const r = state.rounds[i];
      if (!r) {
        rows += `<div class="row is-empty"><span class="no">${i + 1}R</span><span class="score">-</span><span class="rest">-</span></div>`;
      } else {
        let note = '';
        if (r.bust) note = '<small>BUST</small>';
        else if (r.darts === null) note = '<small>?投</small>';
        else if (r.darts < DARTS_PER_ROUND) note = `<small>${r.darts}投</small>`;
        rows += `<div class="row${r.bust ? ' is-bust' : ''}">` +
          `<span class="no">${i + 1}R</span>` +
          `<span class="score">${r.input}${note}</span>` +
          `<span class="rest">→ ${r.remaining}</span></div>`;
      }
    }
    el.history.innerHTML = rows;
  }

  function renderGames() {
    const games = recentGames();

    let totalScored = 0;
    let totalGameDarts = 0;
    let wins = 0;
    let best = null;
    for (const g of games) {
      totalScored += g.scored;
      totalGameDarts += g.darts;
      if (g.win) wins++;
      if (best === null || g.avg > best) best = g.avg;
    }

    el.totalAverage.textContent = totalGameDarts === 0
      ? '--'
      : (totalScored / totalGameDarts * DARTS_PER_ROUND).toFixed(1);
    el.winCount.textContent = wins;
    el.gameCount.textContent = games.length;
    el.bestAverage.textContent = best === null ? '--' : best.toFixed(1);

    let rows = '';
    for (let i = 0; i < MAX_GAMES; i++) {
      const g = games[i];
      if (!g) {
        rows += `<div class="game is-empty"><span class="gno">-</span><span class="gavg">-</span><span class="gres">-</span></div>`;
      } else {
        rows += `<div class="game${g.win ? ' is-win' : ''}">` +
          `<span class="gno">G${g.no}</span>` +
          `<span class="gavg">${g.avg.toFixed(1)}</span>` +
          `<span class="gres">${g.win ? `${g.darts}投` : `残${g.remaining}`}</span></div>`;
      }
    }
    el.gameList.innerHTML = rows;
  }

  function render() {
    el.remaining.textContent = state.remaining;
    el.remainingBox.className = 'panel remaining' + (state.result ? ` is-${state.result}` : '');

    const avg = average();
    el.average.textContent = avg === null ? '--' : avg.toFixed(1);
    el.roundCount.textContent = state.rounds.length;

    el.message.textContent = state.message;
    el.message.className = 'message' + (state.messageType ? ` is-${state.messageType}` : '');

    el.input.disabled = state.result !== null;
    el.input.className = state.awaitingDarts ? 'is-darts' : '';

    renderRounds();
    renderGames();

    if (!el.input.disabled) el.input.focus();
  }

  el.input.addEventListener('input', () => {
    el.input.value = state.awaitingDarts
      ? el.input.value.replace(/[^1-3]/g, '').slice(0, 1)
      : el.input.value.replace(/\D/g, '').slice(0, 3);
  });

  el.input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (el.input.value === '') return;
      const value = Number(el.input.value);
      el.input.value = '';
      if (state.awaitingDarts) submitDarts(value);
      else submitRound(value);
    } else if (e.key === 'Escape') {
      el.input.value = '';
    }
  });

  document.addEventListener('keydown', (e) => {
    // ゲーム終了後（上がり / 10R消化）は Enter で次のゲームへ。
    // 終了と同時のキー入力で走らないよう、入力欄からのイベントは除外する。
    if (e.key === 'Enter' && state.result !== null && e.target !== el.input) {
      e.preventDefault();
      reset();
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      undo();
    }
  });

  // 入力欄から外れても、すぐキーボードで打てるように戻す（ボタン操作時は邪魔しない）
  el.input.addEventListener('blur', (e) => {
    if (e.relatedTarget && e.relatedTarget.tagName === 'BUTTON') return;
    setTimeout(() => { if (!el.input.disabled) el.input.focus(); }, 0);
  });

  el.undo.addEventListener('click', undo);
  el.reset.addEventListener('click', reset);
  el.clearGames.addEventListener('click', clearGames);

  render();
</script>
</body>
</html>
